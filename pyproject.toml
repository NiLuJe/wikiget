[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikiget"
dynamic = ["version"]
description = "CLI tool for downloading files from Wikimedia Commons"
readme = "README.md"
authors = [
  {name = "Cody Logan", email = "cody@lokken.dev"}
]
maintainers = [
  {name = "NiLuJe", email = "ninuje@gmail.com"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Internet",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: System :: Networking",
  "Topic :: Utilities",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
keywords = ["commons", "mediawiki", "wikimedia", "wikipedia"]
license = {text = "GPL-3.0-or-later"}
dependencies = [
  "attrs>=26.1.0",
  "cyclopts>=5.1.1",
  "more-itertools>=11.1.0",
  "niquests[speedups]>=3.21.2",
  "rich>=15.0.0",
]
requires-python = ">= 3.14"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
bugs = "https://github.com/NiLuJe/wikiget/issues"
changelog = "https://github.com/NiLuJe/wikiget/releases"
documentation = "https://NiLuJe.github.io/wikiget/"
homepage = "https://github.com/NiLuJe/wikiget"

[project.scripts]
wikiget = "wikiget.wikiget:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 122

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
extend-ignore = ["E402", "W191", "E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.format]
indent-style = "space"

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.hatch.version]
path = "src/wikiget/version.py"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
]

[tool.hatch.build.targets.wheel.shared-data]
"docs/wikiget.1" = "share/man/man1/wikiget.1"
"README.md" = "share/doc/wikiget/README.md"
"LICENSE" = "share/doc/wikiget/LICENSE"
